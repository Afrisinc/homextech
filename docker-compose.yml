version: '3.8'

services:
  homextech:
    image: ghcr.io/${{ github.repository }}:latest
    container_name: homextech
    ports:
      - "5000:80"
    restart: unless-stopped
    environment:
      - TZ=UTC
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
